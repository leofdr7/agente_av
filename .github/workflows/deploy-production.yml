name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  backend:
    name: Deploy Cloud Run
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY || 'agenta' }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'agenta-api' }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      CLERK_JWKS_URL: ${{ vars.CLERK_JWKS_URL }}
      CLERK_AUTHORIZED_PARTIES: ${{ vars.CLERK_AUTHORIZED_PARTIES }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'openai' }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      ANTHROPIC_API_KEY_VERSION: ${{ vars.ANTHROPIC_API_KEY_VERSION }}
      SUPABASE_SERVICE_KEY_VERSION: ${{ vars.SUPABASE_SERVICE_KEY_VERSION }}
      CLERK_SECRET_KEY_VERSION: ${{ vars.CLERK_SECRET_KEY_VERSION }}
      OPENAI_API_KEY_VERSION: ${{ vars.OPENAI_API_KEY_VERSION }}
      VOYAGE_API_KEY_VERSION: ${{ vars.VOYAGE_API_KEY_VERSION }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate target
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          for name in GCP_PROJECT_ID WIF_PROVIDER DEPLOY_SA GCP_RUNTIME_SERVICE_ACCOUNT SUPABASE_URL CLERK_JWKS_URL CLERK_AUTHORIZED_PARTIES ANTHROPIC_MODEL; do
            if [ -z "${!name}" ]; then echo "Missing production variable: $name" >&2; exit 1; fi
          done
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Image name
        id: image
        run: echo "name=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REGISTRY_REPOSITORY/backend" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7.4.0
        id: build
        with:
          context: backend
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy and check database readiness
        id: deploy
        env:
          BACKEND_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: bash scripts/production/deploy-backend.sh

  frontend:
    name: Deploy Vercel
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_PUBLIC_API_URL: ${{ needs.backend.outputs.url }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Validate Vercel target
        run: |
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then echo "Missing production setting: $name" >&2; exit 1; fi
          done
      - run: npm install --global vercel@59.25.2
      # Ejecutar desde raíz: el proyecto de Vercel tiene Root Directory=frontend.
      # Vercel conserva CLERK_SECRET_KEY: env pull devuelve [SENSITIVE].
      - name: Build and publish production on Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
            --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_ORG_ID" \
            --build-env="NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" \
            --env="NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Frontend: $url" >> "$GITHUB_STEP_SUMMARY"
