name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      AUTH_DISABLED: "false"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_KEY: test-service-key
      CLERK_JWKS_URL: https://test.clerk.accounts.dev/.well-known/jwks.json
      CLERK_AUTHORIZED_PARTIES: http://localhost:3000
      RATE_LIMIT_ENABLED: "false"
      # Las pruebas reales de Anthropic son opt-in; CI nunca consume claves/cupos.
      RUN_LIVE_AGENT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      - name: PDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Clave sintética, formato válido para compilar. No pertenece a una instancia.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      NEXT_PUBLIC_API_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  container:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Deployment configuration tests (no cloud credentials)
        run: python3 -m unittest discover -s scripts/production/tests -v
      - uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: agenta-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Non-root, PDF and healthcheck smoke test
        run: bash scripts/production/test-container.sh agenta-backend:ci
